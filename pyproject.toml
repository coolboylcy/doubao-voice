[project]
name = "voice-doggo"
version = "0.1.0"
description = "豆包流式语音识别驱动的 macOS 全局听写"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14.0",
    "sounddevice>=0.4.7",
]

[project.scripts]
doggo = "voice_doggo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: 打真实豆包 API，需凭证，默认跳过",
]
addopts = "-m 'not live'"

[tool.ruff.lint]
# CLI/daemon 是错误隔离边界：硬件、网络、第三方运行时异常都必须转成用户可读
# 错误，不能因异常类型超出白名单而让后台直接崩溃。
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_doggo"]
